name: Verify OHOS artifacts

on:
  workflow_run:
    workflows: [Native OpenJDK]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run:
        description: Native OpenJDK run ID (blank selects the latest successful run on this branch)
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    # Push builds cover all four targets; filtered dispatch builds may lack OHOS.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify OHOS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run || '' }}
        run: python3 scripts/verify-ohos-artifact.py github
