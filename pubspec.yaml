name: qfli_java
description: "QFLIJVMX: Java editor with JDK compilation and execution."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  qfli_studio_core:
    path: ../qfli_studio_core

  cupertino_icons: ^1.0.8

  # java_runner.dart 用它做路径处理（p.extension / p.basename）。
  # 不显式声明的话 flutter analyze 会报 depend_on_referenced_packages——
  # 只是靠传递依赖拿到了包，哪天上游不带了就编不过。
  path: ^1.9.1
  archive: ^4.0.7

dependency_overrides:
  re_editor:
    path: ../qfli_studio_core/vendor/re_editor

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    # Java EE offline dependency packs (see tools/prepare_javaee_packs.py).
    # Declared as directories so the pinned JAR list, its hashed manifest and the
    # licence documents are packaged together; lib/spring_boot_bundle.dart reads
    # the hashed manifest to discover and verify the exact files at run time.
    # Directory declarations are not recursive, so each subdirectory that holds
    # assets is declared on its own line.
    # The JARs are ignored by Git and reproduced from the lock files.
    - assets/spring_boot/3.5.16/
    - assets/spring_boot/3.5.16/licenses/
    - assets/javaee8/
    - assets/javaee8/licenses/
